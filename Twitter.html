<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X.login</title>
    <link rel="stylesheet" href="/STYLES/left.css" />
    <link rel="stylesheet" href="/STYLES/main.css" />
    <link rel="stylesheet" href="/STYLES/right.css" />
    <link rel="stylesheet" href="/STYLES/footer.css" />
  </head>
  <body>
    <div class="main">
      <div class="left-side">
        <div class="logo-container">
          <img
            class="twitter-logo logo-twitter"
            src="/Images-folder/X.jpeg"
            alt="twitter logo"
          />
        </div>
        <h1 class="twitter-text">Happening now.</h1>
        <button class="phone-button">
          <div class="phone-login">
            <img src="/Images-folder/phone.jpeg" alt="phone logo" />
            <a href="http://www.phone.com">Continue with phone</a>
          </div>
        </button>
        <button class="google-button">
          <div class="google-login">
            <img src="/Images-folder/google.jpeg" alt="google logo" />
            <a href="http://www.google.com">Continue with Google </a>
          </div>
        </button>
        <button class="apple-button">
          <div class="apple-logo">
            <img src="/Images-folder/Apple.jpeg" alt="apple logo" />
            <a href="http://www.Apple.com">Continue with Apple</a>
          </div>
        </button>
        <div class="divider">
          <span>or</span>
        </div>
        <div class="email-login">
          <input type="text" id="email" placeholder="" required />
          <label for="email">Email or username</label>
        </div>
        <button class="continue-button">Continue</button>
        <p class="cookie-text">
          By continuing, you agee to our
          <span class="domain-text">Terms of service, privacy policy</span> and
          <span class="domain-text">cookie use.</span>
        </p>
      </div>
      <div class="right-side">
        <img src="/Images-folder/X.jpeg" alt="x logo" />
      </div>
    </div>
    <footer class="x-footer">
      <nav class="footer-links">
        <a href="#">About</a>
        <a href="#">Get App</a>
        <a href="#">Grok</a>
        <a href="#">Help</a>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Cookies</a>
        <a href="#">Careers</a>
        <a href="#">Ads &amp; Business</a>
        <a href="#">Developers</a>
        <a href="#">News</a>
        <a href="#">Accessibility</a>
      </nav>

      <p class="copyright">© 2026 X Corp.</p>
    </footer>
  </body>
</html>
